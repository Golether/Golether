# Publishes the project page (Sources/Apps/Golether.Pages) at https://golether.github.io/ and the browser version
# (Sources/Apps/Golether.Browser) at https://golether.github.io/watch/.
#
# The root of an organization's site is served only from its repository Golether/golether.github.io, so the page is
# copied there as a commit, and GitHub Pages of that repository publishes it from its main branch. The commit is
# pushed with a deploy key: it can write to that one repository and nothing else.
# One-time setup: Sources/Apps/Golether.Pages/README.md, "First publication".
# The browser version talks to the rendezvous server named by the repository variable BROWSER_SERVER (a host name such
# as meet.example.org); without it the site is published without watch/. See the README, "The browser version".
name: Pages

on:
  push:
    branches: [main]
    # The browser version is built from most of the sources, so a change of any of them may change it; an unchanged
    # result commits nothing.
    paths:
      - 'Sources/**'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'global.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

# Two runs pushing at once would race; a newer push makes the older one pointless.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check the deploy key
        env:
          SITE_DEPLOY_KEY: ${{ secrets.SITE_DEPLOY_KEY }}
        run: |
          if [ -z "$SITE_DEPLOY_KEY" ]; then
            echo "::error::The secret SITE_DEPLOY_KEY is missing: see Sources/Apps/Golether.Pages/README.md, First publication."
            exit 1
          fi
      # The address is checked before anything is built: it ends up in a file every visitor's browser follows.
      - name: Check the server of the browser version
        id: server
        env:
          BROWSER_SERVER: ${{ vars.BROWSER_SERVER }}
        run: |
          if [ -z "$BROWSER_SERVER" ]; then
            echo "::warning::The variable BROWSER_SERVER is not set: the site is published without the browser version."
            echo "host=" >> "$GITHUB_OUTPUT"
          elif [[ "$BROWSER_SERVER" =~ ^[A-Za-z0-9]([A-Za-z0-9-]*[A-Za-z0-9])?(\.[A-Za-z0-9]([A-Za-z0-9-]*[A-Za-z0-9])?)+$ ]]; then
            echo "host=$BROWSER_SERVER" >> "$GITHUB_OUTPUT"
          else
            echo "::error::BROWSER_SERVER must be a host name such as meet.example.org, without a scheme or a port."
            exit 1
          fi
      - uses: actions/setup-dotnet@v4
        if: steps.server.outputs.host != ''
        with:
          global-json-file: global.json
      # Avalonia links its native Skia into the WebAssembly of .NET, which needs the workload.
      - name: Build the browser version
        if: steps.server.outputs.host != ''
        run: |
          dotnet workload install wasm-tools
          dotnet publish Sources/Apps/Golether.Browser -c Release -o browser
      - uses: actions/checkout@v4
        with:
          repository: Golether/golether.github.io
          ssh-key: ${{ secrets.SITE_DEPLOY_KEY }}
          path: site
      # The site repository holds exactly the page: files deleted here disappear there. Without Jekyll every file is
      # served as it is, including folders whose names begin with an underscore (_framework of the browser version).
      - name: Copy the page
        run: |
          rsync -a --delete --exclude .git Sources/Apps/Golether.Pages/ site/
          touch site/.nojekyll
      # GitHub Pages compresses by itself, so the compressed copies of the build are left out. config.json of the
      # sources points to a server on the developer's computer; the published one points to BROWSER_SERVER, at the
      # default ports of the server: the rendezvous and STUN on 47900, the signalling on 47943.
      - name: Copy the browser version
        if: steps.server.outputs.host != ''
        env:
          HOST: ${{ steps.server.outputs.host }}
        run: |
          rsync -a --exclude '*.gz' --exclude '*.br' browser/wwwroot/ site/watch/
          printf '{\n  "signal": "wss://%s:47943/signal",\n  "stun": "stun:%s:47900",\n  "meet": "%s:47900"\n}\n' \
            "$HOST" "$HOST" "$HOST" > site/watch/config.json
      - name: Push the page
        working-directory: site
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "The page has not changed."
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "The page of Golether/Golether@${GITHUB_SHA}"
          git push
